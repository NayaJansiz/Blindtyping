<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blind Typing — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07070f; --surface: #0f0f1a; --surface2: #161624;
      --border: #1e1e32; --accent: #7c6ffa; --accent2: #a89cfc;
      --text: #ddddf0; --muted: #52526e;
      --danger: #f87171; --danger-bg: rgba(239,68,68,.1); --danger-border: rgba(239,68,68,.2);
      --gold: #f59e0b; --silver: #9ca3af; --bronze: #b45309;
      --time-color: #4ade80;
    }
    html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .org { font-size: 10px; letter-spacing: .14em; color: var(--accent2); font-weight: 600; text-transform: uppercase; display: block; margin-bottom: 2px; }
    .title { font-size: 18px; font-weight: 700; }
    .admin-tag { background: rgba(124,111,250,.12); border: 1px solid rgba(124,111,250,.25); border-radius: 20px; padding: 5px 12px; font-size: 11px; font-weight: 600; color: var(--accent2); }
    main { padding: 20px; max-width: 540px; margin: 0 auto; }
    .stats { display: flex; gap: 12px; margin-bottom: 24px; }
    .stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; }
    .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .section-title { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--accent2); text-transform: uppercase; margin-bottom: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
    .input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; transition: border-color .15s; }
    .input:focus { border-color: var(--accent); }
    .input::placeholder { color: var(--muted); }
    .input-label { font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; }
    .input-group { display: flex; flex-direction: column; }
    .error-msg { color: var(--danger); font-size: 13px; min-height: 18px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 22px; border-radius: 7px; border: none; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .1s; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover { opacity: .85; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); padding: 5px 12px; font-size: 12px; }
    .btn-danger:hover { background: rgba(239,68,68,.18); }
    .t-list { display: flex; flex-direction: column; gap: 8px; }
    .t-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .t-info { display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .t-members { font-weight: 600; font-size: 14px; }
    .t-member2 { font-size: 12px; color: var(--muted); }
    .t-time { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--time-color); margin-right: 10px; }
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 5px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; margin-right: 8px; }
    .r1 { background: rgba(245,158,11,.12); color: var(--gold); border: 1px solid rgba(245,158,11,.25); }
    .r2 { background: rgba(156,163,175,.1); color: var(--silver); border: 1px solid rgba(156,163,175,.2); }
    .r3 { background: rgba(180,83,9,.12); color: var(--bronze); border: 1px solid rgba(180,83,9,.25); }
    .rn { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .empty-list { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 100; white-space: nowrap; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header class="header">
    <div>
      <span class="org">Blind Typing Challenge</span>
      <span class="title">Admin Panel</span>
    </div>
    <span class="admin-tag">Admin</span>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><div class="stat-val" id="stat-t">0</div><div class="stat-lbl">Teams</div></div>
      <div class="stat"><div class="stat-val" id="stat-best">—</div><div class="stat-lbl">Best time</div></div>
    </div>

    <div class="section-title">Add Team</div>
    <div class="card">
      <div class="input-group">
        <div class="input-label">Member 1</div>
        <input class="input" id="m1" placeholder="First member name" type="text" />
      </div>
      <div class="input-group">
        <div class="input-label">Member 2</div>
        <input class="input" id="m2" placeholder="Second member name" type="text" />
      </div>
      <div class="input-group">
        <div class="input-label">Time (seconds)</div>
        <input class="input" id="time-input" placeholder="e.g. 42" type="number" min="1" />
      </div>
      <div class="error-msg" id="error-msg"></div>
      <button class="btn btn-primary" id="add-btn" onclick="addTeam()">Add to scoreboard</button>
    </div>

    <div class="section-title">Teams</div>
    <div class="t-list" id="t-list"><div class="empty-list">No teams yet.</div></div>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const BIN_ID  = '6ab2b72dffd5d1605323b6ee';
    const API_KEY = '$2a$10$kTWZAmRf2LMtsqir/UHGb.2Nd0YygmGZP0BOCtj/BZhiuO2TTgXjm';
    let teams = [];

    async function addTeam() {
      const m1 = document.getElementById('m1').value.trim();
      const m2 = document.getElementById('m2').value.trim();
      const time = parseInt(document.getElementById('time-input').value, 10);
      const errEl = document.getElementById('error-msg');

      if (!m1) { errEl.textContent = 'Enter Member 1 name.'; return; }
      if (!m2) { errEl.textContent = 'Enter Member 2 name.'; return; }
      if (!time || time <= 0) { errEl.textContent = 'Enter a valid time in seconds.'; return; }
      errEl.textContent = '';

      const btn = document.getElementById('add-btn');
      btn.disabled = true; btn.textContent = 'Saving…';

      const newT = { id: Date.now().toString(), member1: m1, member2: m2, time };
      teams.push(newT);
      const ok = await saveData();
      if (ok) {
        document.getElementById('m1').value = '';
        document.getElementById('m2').value = '';
        document.getElementById('time-input').value = '';
        document.getElementById('m1').focus();
        renderList(); updateStats();
        showToast(`${m1} & ${m2} added! ✓`);
      } else {
        teams.pop();
        showToast('Save failed — try again', true);
      }
      btn.disabled = false; btn.textContent = 'Add to scoreboard';
    }

    async function removeTeam(id) {
      teams = teams.filter(t => t.id !== id);
      await saveData(); renderList(); updateStats();
    }

    async function saveData() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify({ teams })
        });
        return res.ok;
      } catch(e) { return false; }
    }

    async function loadData() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        teams = data.record?.teams || [];
        renderList(); updateStats();
      } catch(e) { console.error(e); }
    }

    function esc(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function renderList() {
      const c = document.getElementById('t-list');
      if (teams.length === 0) { c.innerHTML = '<div class="empty-list">No teams yet.</div>'; return; }
      const sorted = [...teams].sort((a, b) => a.time - b.time);
      c.innerHTML = sorted.map((t, i) => {
        const rc = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
        return `<div class="t-card">
          <span class="rank-badge ${rc}">${i+1}</span>
          <div class="t-info">
            <span class="t-members">${esc(t.member1)}</span>
            <span class="t-member2">${esc(t.member2)}</span>
          </div>
          <span class="t-time">${t.time}s</span>
          <button class="btn btn-danger" onclick="removeTeam('${t.id}')">Remove</button>
        </div>`;
      }).join('');
    }

    function updateStats() {
      document.getElementById('stat-t').textContent = teams.length;
      const best = teams.length ? Math.min(...teams.map(t => t.time)) + 's' : '—';
      document.getElementById('stat-best').textContent = best;
    }

    function showToast(msg, isError=false) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.style.background = isError ? '#dc2626' : '#16a34a';
      t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500);
    }

    loadData();
  </script>
</body>
</html>
